name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Desktop app compile check (net48 references, warnings as errors)
        run: dotnet build tools/CompileCheck/CompileCheck.vbproj -c Release
      - name: Core tests
        run: dotnet run --project Tests -c Release
      - name: Web portal build and integration tests
        run: dotnet test tests/Basira.Web.Tests -c Release
