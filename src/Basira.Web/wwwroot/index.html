<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>بصيرة | منصة الأرشفة الذكية</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f7a6d'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="app" hidden>
  <header class="top">
    <a class="brand" href="#/pulse" aria-label="بصيرة"><span class="logo" aria-hidden="true"></span><b>بصيرة</b><small>منصة الأرشفة الذكية</small></a>
    <nav id="nav" aria-label="التنقل الرئيسي"></nav>
    <div class="who">
      <span id="who-name"></span>
      <button id="logout" class="btn ghost" type="button">خروج</button>
    </div>
  </header>
  <main id="view" tabindex="-1"></main>
</div>

<section id="login" class="login" hidden>
  <form id="login-form" class="card login-card" autocomplete="on">
    <div class="login-brand"><span class="logo big" aria-hidden="true"></span><h1>بصيرة</h1><p>منصة الأرشفة الذكية</p></div>
    <label for="u">اسم المستخدم</label>
    <input id="u" name="username" autocomplete="username" required maxlength="80" autofocus>
    <label for="p">كلمة المرور</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required maxlength="200">
    <p id="login-error" class="error" role="alert" aria-live="assertive"></p>
    <button class="btn primary wide" type="submit">دخول</button>
  </form>
</section>

<aside id="drawer" class="drawer" hidden role="dialog" aria-modal="true" aria-labelledby="drawer-title">
  <div class="drawer-panel">
    <button id="drawer-close" class="btn ghost close" type="button" aria-label="إغلاق">✕</button>
    <div id="drawer-body"></div>
  </div>
</aside>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/app.js"></script>
</body>
</html>
