# مثال جدار حماية لمضيف البوابة (nftables). يفترض: LAN الكاميرات على eth0، وواجهة الـ VPN على wg0.
# المبدأ: الكاميرات لا تُعرَّض للإنترنت أبداً؛ البوابة هي الجهاز الوحيد الذي يصل إليها، والعملاء يصلون للبوابة فقط عبر الـ VPN.
table inet ptz {
  chain input {
    type filter hook input priority 0; policy drop;
    ct state established,related accept
    iif lo accept
    # إدارة SSH من LAN فقط (عدّل حسب بيئتك)
    iifname "eth0" tcp dport 22 accept
    # البوابة: من واجهة الـ VPN فقط
    iifname "wg0" tcp dport 8443 accept
    # ping للتشخيص (اختياري)
    icmp type echo-request limit rate 5/second accept
  }
  chain forward {
    type filter hook forward priority 0; policy drop;       # لا تمرير: البوابة ليست موجِّهاً
  }
  chain output {
    type filter hook output priority 0; policy accept;
  }
}
